
name: matrix options

on:
  workflow_dispatch:

jobs:
  docker_job:
    strategy:
       max-parallel: 2
       matrix:
         os: [ubuntu-latest, windows-latest]
         images: [hello-world, alpine]
         exclude:
            - images: alpine
              os: windows-latest
         include:
            - images: "awd 64/alpine"
              os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: print the sum word
        run: echo "hello world"

      - name: list the files
        run: ls 
