name: firstexample

on: 
  workflow_dispatch

jobs:
  build_job: 
    runs-on: ubuntu-latest
    steps:
      - name: "install the COWSAY"
        run: sudo apt install cowsay -y

      - name: print the cowsay
        run: cowsay "hello srihari!!" >> srihari.txt

      - name: upload the srihari file 
        uses : actions/upload-artifact@v4
        with:
          name : srihari.txt
          path: srihari.txt


  test_job:
    needs : build_job
    runs-on: ubuntu-latest
    steps:
      - name: download the srihari file
        uses : actions/download-artifact@v4
        with:
          name : srihari.txt
      - name: test the srihari file
        run: grep -i hello srihari.txt

  deploy_job:
    needs: [test_job]
    concurrency:
      group : production_deployment
      cancel-in-progress: true 
    runs-on: ubuntu-latest
    steps:
      timeout-minutes:1
      - name: download the srihari file and message 
        uses : actions/download-artifact@v4
        with:
          name : srihari.txt
      - name: deploy the filessel
        run: |
          echo "deployeds"
          sleep 600s