name: firstexample

on: push

jobs:
  build_job: 
    runs-on: ubuntu-latest
    steps:
      - name: "install the COWSAY"
        run: sudo apt install cowsay -y

      - name: print the cowsay
        run: cowsay "hello srihari!!" >> srihari.txt

      - name: upload the srihari file 
        uses : actions/upload-artifact@v4
        with:
          name : srihart file upload
          path: srihari.txt


  test_job:
    needs : build_job
    runs-on: ubuntu-latest
    steps:
      - name: download the srihari file
        uses : action/download-artifact@v4
        with:
          name : download the srihari file
      - name: test the srihari file
        run: grep -i hello srihari.txt

  deploy_job:
    needs: [test_job]
    runs-on: ubuntu-latest
    steps:
      - name: download the srihari file
        uses : action/download-artifact@v4
        with:
          name : download the srihari file
      - name: deploy the file
        run: echo "deployed"